<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>/* hostile "site theme" styles, like a Squarespace template */
body{font-family:Georgia,serif;font-size:19px;color:#5a1a1a;background:#fffaf0;letter-spacing:.06em;margin:0;padding:40px}
p,span,div{line-height:2}

table{border:4px double #c00;width:auto}th,td{padding:20px;border:1px solid #c00;background:#ffe}
label{display:block;font-size:24px;color:green}

.sqs-block-code{max-width:980px;margin:auto}
</style></head><body>
<p id="host-p">Host paragraph should stay styled by the site theme.</p>
<div class="sqs-block-code" id="block">__SNIPPET__</div>
